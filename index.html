<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FigmaDG - FigJam風 + Script</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
    background: #1e1e1e; color: #ddd; overflow: hidden;
  }

  /* ===== ログイン ===== */
  #loginScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1e1e1e, #2c2c3c);
    display: flex; align-items: center; justify-content: center;
    z-index: 100000;
  }
  #loginScreen.hidden { display: none; }
  .login-box {
    background: #2a2a2a; padding: 40px; border-radius: 12px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid #444; max-width: 400px; width: 90%;
  }
  .login-box h1 { margin-bottom: 8px; font-size: 24px; }
  .login-box p { color: #999; font-size: 14px; margin-bottom: 24px; }
  .g-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; background: #fff; color: #333; border: none;
    padding: 12px 24px; border-radius: 6px; font-size: 15px;
    font-weight: 600; cursor: pointer; width: 100%; transition: 0.2s;
  }
  .g-btn:hover { background: #f0f0f0; transform: translateY(-1px); }
  .g-btn svg { width: 20px; height: 20px; }
  #loginError { color: #e74c3c; margin-top: 16px; font-size: 13px; min-height: 18px; word-break: break-all; }

  /* ===== ツールバー ===== */
  #toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #2c2c2c;
    border-bottom: 1px solid #444; flex-wrap: wrap;
  }
  #toolbar button, #toolbar input {
    background: #3a3a3a; color: #eee; border: 1px solid #555;
    padding: 6px 10px; border-radius: 4px; font-size: 13px; cursor: pointer;
  }
  #toolbar button.active { background: #0d99ff; border-color: #0d99ff; }
  #toolbar button:hover { background: #4a4a4a; }

  #main { flex: 1; display: flex; overflow: hidden; position: relative; }

  /* ===== キャンバス ===== */
  #canvas {
    flex: 1; position: relative;
    background: #f7f7f9; overflow: hidden;
    background-image: radial-gradient(circle, #ddd 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* ===== 要素 ===== */
  .element {
    position: absolute; user-select: none; cursor: move;
    transition: box-shadow 0.15s;
  }
  .element:hover { box-shadow: 0 0 0 2px rgba(13,153,255,0.3); }
  .element.selected { box-shadow: 0 0 0 3px #0d99ff, 0 4px 12px rgba(0,0,0,0.15); }

  /* スクリプト要素はiframeで表示 */
  .element.has-script {
    padding: 0 !important;
    background: transparent !important;
    overflow: visible !important;
  }
  .element.has-script .script-frame {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: transparent;
    pointer-events: auto;
  }
  .element.has-script .script-wrapper {
    width: 100%; height: 100%;
    display: block;
    background: transparent;
  }

  .element .resize-handle {
    position: absolute; width: 10px; height: 10px;
    background: white; border: 2px solid #0d99ff;
    border-radius: 50%; display: none; z-index: 5;
  }
  .element.selected .resize-handle { display: block; }
  .resize-handle.br { right: -5px; bottom: -5px; cursor: se-resize; }
  .resize-handle.bl { left: -5px; bottom: -5px; cursor: sw-resize; }
  .resize-handle.tr { right: -5px; top: -5px; cursor: ne-resize; }
  .resize-handle.tl { left: -5px; top: -5px; cursor: nw-resize; }

  .element .delete-btn {
    position: absolute; top: -12px; right: -12px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #c0392b; color: white; border: 2px solid white;
    font-size: 12px; line-height: 1; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-weight: bold; z-index: 6;
  }
  .element.selected .delete-btn { display: flex; }
  .element .delete-btn:hover { background: #e74c3c; }

  /* スクリプト有効マーク */
  .element .script-badge {
    position: absolute; top: -10px; left: -10px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #f39c12; color: white;
    font-size: 11px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid white; z-index: 7;
    pointer-events: none;
  }

  /* ===== 要素タイプ ===== */
  .el-sticky {
    width: 180px; height: 180px;
    padding: 12px; border-radius: 3px;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    font-size: 14px; line-height: 1.4;
    overflow: hidden; word-wrap: break-word; outline: none;
  }
  .el-rect { width: 160px; height: 100px; border-radius: 6px; }
  .el-circle { width: 120px; height: 120px; border-radius: 50%; }
  .el-triangle {
    width: 0; height: 0;
    border-left: 70px solid transparent;
    border-right: 70px solid transparent;
    border-bottom: 120px solid #0d99ff;
  }
  .el-arrow {
    width: 180px; height: 6px;
    background: #0d99ff; border-radius: 3px;
  }
  .el-arrow::after {
    content: ''; position: absolute; right: -2px; top: 50%;
    transform: translateY(-50%);
    border: 10px solid transparent;
    border-left-color: inherit;
  }
  .el-text {
    padding: 4px 6px; color: #222; outline: none;
    min-width: 40px; border-radius: 4px;
    font-size: 18px; line-height: 1.3; white-space: pre-wrap;
  }
  .el-comment {
    width: 200px; background: #fff;
    border: 2px solid #f39c12; border-radius: 10px;
    padding: 10px; font-size: 13px; color: #222;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
  }
  .el-comment::before {
    content: ''; position: absolute; bottom: -10px; left: 20px;
    border: 8px solid transparent; border-top-color: #f39c12;
  }
  .el-image { max-width: 600px; }
  .el-image img { display: block; max-width: 100%; border-radius: 6px; }
  .el-stamp {
    font-size: 60px; line-height: 1;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
  }

  /* ===== リモートカーソル ===== */
  .remote-cursor {
    position: absolute; pointer-events: none; z-index: 9999;
    transition: transform 0.08s linear;
    transform-origin: top left;
  }
  .remote-cursor svg { display: block; }
  .remote-cursor .label {
    position: absolute; left: 14px; top: 14px;
    padding: 2px 6px; border-radius: 3px;
    font-size: 11px; color: white; white-space: nowrap; font-weight: 500;
  }

  /* ===== カーソル吹き出し ===== */
  .cursor-bubble {
    position: absolute; pointer-events: none; z-index: 9998;
    transform-origin: top left; transition: transform 0.08s linear;
  }
  .cursor-bubble .bubble {
    margin-left: 22px; margin-top: 10px;
    color: #222; border-radius: 16px;
    padding: 8px 14px; font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    max-width: 240px; word-wrap: break-word;
    position: relative; animation: popIn 0.2s ease-out;
  }
  .cursor-bubble .bubble::before {
    content: ''; position: absolute; left: -6px; top: 12px;
    border: 6px solid transparent;
    border-right-color: inherit;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8) translateY(-4px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ===== 自分の入力吹き出し ===== */
  #myBubble {
    position: fixed; z-index: 10001; display: none;
    transform-origin: top left; pointer-events: auto;
  }
  #myBubble.show { display: block; }
  #myBubble .bubble-wrap {
    margin-left: 22px; margin-top: 10px;
    background: #0d99ff; border-radius: 16px;
    padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    display: flex; align-items: center; gap: 6px;
    position: relative; min-width: 220px;
  }
  #myBubble .bubble-wrap::before {
    content: ''; position: absolute; left: -6px; top: 12px;
    border: 6px solid transparent;
    border-right-color: #0d99ff;
  }
  #myBubble input {
    background: transparent; border: none;
    color: white; font-size: 13px; font-weight: 500;
    outline: none; flex: 1; padding: 4px 8px; min-width: 100px;
  }
  #myBubble input::placeholder { color: rgba(255,255,255,0.6); }
  #myBubble button {
    background: white; color: #0d99ff;
    border: none; padding: 4px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #myBubble button.close {
    background: rgba(255,255,255,0.2); color: white; padding: 4px 8px;
  }

  /* ===== プロパティパネル ===== */
  #propPanel {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: #2a2a2a; border: 1px solid #444;
    border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    padding: 10px 14px; display: none; gap: 10px;
    align-items: center; z-index: 55000;
    flex-wrap: wrap; max-width: 95vw;
  }
  #propPanel.show { display: flex; }
  #propPanel .pp-group {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px; border-right: 1px solid #444;
  }
  #propPanel .pp-group:last-child { border-right: none; }
  #propPanel label {
    font-size: 10px; color: #999;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  #propPanel input[type="color"] {
    width: 32px; height: 32px; border: 2px solid #555;
    border-radius: 6px; cursor: pointer; background: none; padding: 0;
  }
  #propPanel input[type="number"] {
    width: 60px; background: #1a1a1a; color: #eee;
    border: 1px solid #555; border-radius: 4px;
    padding: 5px 8px; font-size: 13px;
  }
  #propPanel input[type="text"] {
    background: #1a1a1a; color: #eee;
    border: 1px solid #555; border-radius: 4px;
    padding: 5px 8px; font-size: 12px;
  }
  #propPanel button {
    background: #3a3a3a; color: #eee;
    border: 1px solid #555; border-radius: 4px;
    padding: 5px 10px; font-size: 13px; cursor: pointer;
    min-width: 32px;
  }
  #propPanel button.active { background: #0d99ff; border-color: #0d99ff; color: white; }
  #propPanel button:hover { background: #4a4a4a; }
  #propPanel button.code-btn {
    background: #f39c12; border-color: #f39c12;
    color: white; font-weight: 600;
  }
  #propPanel button.code-btn:hover { background: #e67e22; }
  #propPanel button.code-btn.has-code {
    background: #27ae60; border-color: #27ae60;
  }

  /* ===== コードエディタモーダル ===== */
  #codeModal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 200000;
  }
  #codeModal.show { display: flex; }
  .code-box {
    background: #2a2a2a; border: 1px solid #444;
    border-radius: 12px; width: 90%; max-width: 700px;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .code-head {
    padding: 14px 18px; border-bottom: 1px solid #444;
    display: flex; justify-content: space-between; align-items: center;
  }
  .code-head h3 { font-size: 15px; }
  .code-head .tabs { display: flex; gap: 4px; }
  .code-head .tabs button {
    background: #3a3a3a; color: #ccc;
    border: none; padding: 6px 12px;
    border-radius: 4px; font-size: 12px; cursor: pointer;
  }
  .code-head .tabs button.active {
    background: #0d99ff; color: white;
  }
  .code-head .close-btn {
    background: transparent; border: none;
    color: #999; font-size: 24px; cursor: pointer;
    padding: 0 4px; line-height: 1;
  }
  .code-body {
    padding: 16px 18px; overflow-y: auto; flex: 1;
  }
  .code-help {
    font-size: 12px; color: #888; margin-bottom: 12px;
    background: #1a1a1a; padding: 10px 12px;
    border-radius: 6px; border-left: 3px solid #f39c12;
    line-height: 1.6;
  }
  .code-help code {
    background: #333; padding: 1px 5px;
    border-radius: 3px; color: #6cc; font-size: 11px;
  }
  #codeTextarea {
    width: 100%; min-height: 280px;
    background: #1a1a1a; color: #d4d4d4;
    border: 1px solid #444; border-radius: 6px;
    padding: 12px; font-family: "Consolas", "Monaco", monospace;
    font-size: 13px; line-height: 1.5;
    resize: vertical; outline: none;
  }
  #codeTextarea:focus { border-color: #0d99ff; }
  .code-foot {
    padding: 12px 18px; border-top: 1px solid #444;
    display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  .code-foot .examples {
    display: flex; gap: 6px; flex-wrap: wrap; flex: 1;
  }
  .code-foot .examples button {
    background: #3a3a3a; color: #ccc;
    border: 1px solid #555; padding: 4px 10px;
    border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  .code-foot .examples button:hover { background: #4a4a4a; color: white; }
  .code-foot .actions { display: flex; gap: 8px; }
  .code-foot .actions button {
    border: none; padding: 8px 16px;
    border-radius: 6px; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  .code-foot .actions button.cancel {
    background: #3a3a3a; color: #eee;
  }
  .code-foot .actions button.save {
    background: #0d99ff; color: white;
  }
  .code-foot .actions button.remove {
    background: #c0392b; color: white;
  }
  .code-foot .actions button:hover { filter: brightness(1.15); }

  /* ===== スクリプト実行結果通知 ===== */
  #scriptLog {
    position: fixed; bottom: 100px; right: 20px;
    width: 320px; max-height: 200px; overflow-y: auto;
    background: rgba(20,20,20,0.95);
    border: 1px solid #444; border-radius: 8px;
    padding: 10px 12px; font-family: monospace;
    font-size: 11px; color: #ccc;
    z-index: 10003; display: none;
  }
  #scriptLog.show { display: block; }
  #scriptLog .log-line { padding: 2px 0; border-bottom: 1px solid #333; }
  #scriptLog .log-line.error { color: #e74c3c; }
  #scriptLog .log-line.log { color: #6cc; }
  #scriptLog .log-head {
    font-size: 10px; color: #999;
    margin-bottom: 4px; text-transform: uppercase;
  }

  /* ===== スラッシュメニュー ===== */
  #slashMenu {
    position: fixed; background: #2a2a2a;
    border: 1px solid #444; border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    z-index: 60000; min-width: 280px;
    max-height: 400px; overflow-y: auto;
    display: none;
  }
  #slashMenu.show { display: block; }
  .slash-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid #333;
    transition: background 0.1s;
  }
  .slash-item:last-child { border-bottom: none; }
  .slash-item:hover, .slash-item.active { background: #0d99ff; }
  .slash-item:hover .si-name, .slash-item.active .si-name,
  .slash-item:hover .si-desc, .slash-item.active .si-desc { color: white; }
  .slash-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: #3a3a3a; border-radius: 6px;
    font-size: 18px; flex-shrink: 0;
  }
  .slash-item:hover .slash-icon, .slash-item.active .slash-icon {
    background: rgba(255,255,255,0.2);
  }
  .slash-info { flex: 1; min-width: 0; }
  .si-name { font-size: 13px; font-weight: 600; color: #eee; }
  .si-desc { font-size: 11px; color: #999; margin-top: 2px; }
  .si-cmd {
    font-size: 11px; color: #0d99ff;
    font-family: monospace; background: #1a1a1a;
    padding: 2px 6px; border-radius: 3px;
  }

  /* ===== チャット ===== */
  #chatPanel {
    position: fixed; right: 20px; bottom: 20px;
    width: 320px; height: 420px;
    background: #2a2a2a; border: 1px solid #444;
    border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    display: none; flex-direction: column; z-index: 55000;
  }
  #chatPanel.show { display: flex; }
  .chat-head {
    padding: 12px 16px; border-bottom: 1px solid #444;
    display: flex; justify-content: space-between;
    align-items: center; font-weight: 600; font-size: 14px;
  }
  .chat-head button {
    background: transparent; border: none;
    color: #999; font-size: 20px; cursor: pointer;
  }
  #chatMessages {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .chat-msg {
    padding: 6px 10px; border-radius: 8px;
    background: #3a3a3a; max-width: 85%; word-wrap: break-word;
  }
  .chat-msg.mine { background: #0d99ff; align-self: flex-end; }
  .chat-msg .cm-author {
    font-size: 10px; font-weight: 600;
    margin-bottom: 3px; opacity: 0.8;
  }
  .chat-msg .cm-text { font-size: 13px; line-height: 1.4; }
  .chat-msg .cm-time { font-size: 9px; opacity: 0.6; margin-top: 3px; }
  .chat-input {
    padding: 10px; border-top: 1px solid #444;
    display: flex; gap: 6px;
  }
  .chat-input input {
    flex: 1; background: #1a1a1a; color: #eee;
    border: 1px solid #444; border-radius: 6px;
    padding: 8px 10px; font-size: 13px; outline: none;
  }
  .chat-input input:focus { border-color: #0d99ff; }
  .chat-input button {
    background: #0d99ff; color: white; border: none;
    padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }

  /* ===== ステータス・ユーザー ===== */
  #status {
    position: absolute; bottom: 12px; left: 12px;
    font-size: 12px; color: #555;
    background: rgba(255,255,255,0.9);
    padding: 6px 10px; border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    pointer-events: none;
  }
  #users { display: flex; gap: 4px; align-items: center; }
  .user-dot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: white; font-weight: bold;
    position: relative;
  }
  .user-dot.me { border-color: #f39c12; }
  .user-dot img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .user-dot.admin::after {
    content: '👑'; position: absolute; top: -8px; right: -8px; font-size: 12px;
  }

  /* ===== 管理者 ===== */
  #adminBtn {
    background: #d35400 !important;
    border-color: #d35400 !important;
    color: white !important; font-weight: 600;
  }
  #adminPanel {
    position: fixed; top: 60px; right: 20px;
    width: 340px; background: #2a2a2a;
    border: 1px solid #444; border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    z-index: 50000; display: none;
  }
  #adminPanel.show { display: block; }
  #adminPanel .ap-head {
    padding: 12px 16px; border-bottom: 1px solid #444;
    display: flex; justify-content: space-between;
    align-items: center; font-weight: 600;
  }
  #adminPanel .ap-head button {
    background: transparent; border: none;
    color: #999; font-size: 20px; cursor: pointer;
  }
  #adminPanel .ap-body { padding: 12px 16px; max-height: 400px; overflow-y: auto; }
  .user-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 6px;
    margin-bottom: 6px; background: #333;
  }
  .user-row img, .user-row .ph {
    width: 32px; height: 32px;
    border-radius: 50%; object-fit: cover; flex-shrink: 0;
  }
  .user-row .ph {
    background: #555; display: flex;
    align-items: center; justify-content: center;
    color: white; font-weight: bold; font-size: 14px;
  }
  .user-row .uinfo { flex: 1; min-width: 0; }
  .user-row .uname {
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .user-row .uemail {
    font-size: 11px; color: #999;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .user-row .ubtn {
    background: #c0392b; color: white; border: none;
    padding: 5px 10px; border-radius: 4px;
    font-size: 11px; cursor: pointer;
    font-weight: 600; white-space: nowrap;
  }
  .user-row .ubtn.unban { background: #27ae60; }
  .user-row.banned { opacity: 0.7; }
  .badge-ban, .badge-admin {
    color: white; font-size: 10px;
    padding: 1px 6px; border-radius: 3px; font-weight: 600;
  }
  .badge-ban { background: #c0392b; }
  .badge-admin { background: #d35400; }

  /* ===== BAN ===== */
  #banScreen {
    position: fixed; inset: 0;
    background: #000; color: #fff;
    display: none; align-items: center; justify-content: center;
    z-index: 999999; text-align: center; font-family: monospace;
  }
  #banScreen.show { display: flex; }
  #banScreen .msg { font-size: 14px; color: #666; }

  /* ===== ヒント ===== */
  #hint {
    position: absolute; top: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(13,153,255,0.95);

// ============ ユーティリティ ============
function colorForUid(uid) {
  const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e','#e91e63','#00bcd4'];
  let h = 0;
  for (let i = 0; i < uid.length; i++) h = (h * 31 + uid.charCodeAt(i)) >>> 0;
  return colors[h % colors.length];
}
function pickColor(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function isAdminEmail(email) { return email && ADMIN_EMAILS.includes(email); }
function isAdminUid(uid) { return uid && ADMIN_UIDS.includes(uid); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function newElemId() { return 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

// ============ ログイン ============
document.getElementById('googleLogin').addEventListener('click', async () => {
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try { await signInWithPopup(auth, provider); }
  catch (e) { errEl.textContent = 'ログイン失敗: ' + e.message; }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (myCursorRef) { try { await remove(myCursorRef); } catch(e){} }
  await signOut(auth);
  location.reload();
});

// ============ BAN ============
function showBanScreen() {
  if (isBanned) return;
  isBanned = true;
  banScreen.classList.add('show');
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('main').style.display = 'none';
  adminPanel.classList.remove('show');
  chatPanel.classList.remove('show');
  slashMenu.classList.remove('show');
  propPanel.classList.remove('show');
  codeModal.classList.remove('show');

  setTimeout(() => {
    try {
      window.history.replaceState(null, '', 'about:blank');
      document.body.innerHTML = '<div style="position:fixed;inset:0;background:#000"></div>';
      try { location.replace('about:blank'); } catch(e) {}
    } catch (e) {}
  }, 1800);
}

// ============ 認証 ============
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    currentUser = null; isAdmin = false;
    loginScreen.classList.remove('hidden');
    unsubscribers.forEach(fn => fn()); unsubscribers = [];
    if (banUnsub) { banUnsub(); banUnsub = null; }
    if (usersUnsub) { usersUnsub(); usersUnsub = null; }
    if (chatUnsub) { chatUnsub(); chatUnsub = null; }
    return;
  }
  currentUser = user;
  loginScreen.classList.add('hidden');

  isAdmin = isAdminEmail(user.email) || isAdminUid(user.uid);
  try {
    const snap = await get(child(ref(db), `admins/${user.uid}`));
    if (snap.exists()) isAdmin = true;
  } catch(e) {}

  try {
    await set(ref(db, `users/${user.uid}`), {
      email: user.email,
      name: user.displayName || user.email.split('@')[0],
      photo: user.photoURL || '',
      lastSeen: Date.now()
    });
  } catch(e) {}

  if (banUnsub) banUnsub();
  banUnsub = onValue(ref(db, 'banned'), (snap) => {
    bannedUsers = snap.val() || {};
    if (bannedUsers[user.uid]) showBanScreen();
  });

  adminBtn.style.display = isAdmin ? '' : 'none';

  const initialRoom = document.getElementById('roomInput').value.trim()
    || 'room-' + Math.random().toString(36).slice(2, 6);
  document.getElementById('roomInput').value = initialRoom;
  joinRoom(initialRoom);
});

// ============ 部屋参加 ============
function joinRoom(id) {
  unsubscribers.forEach(fn => fn());
  unsubscribers = [];
  canvas.querySelectorAll('.element, .remote-cursor, .cursor-bubble').forEach(el => el.remove());
  elements = {}; elementRefs = {};
  usersEl.innerHTML = '';

  roomId = id;
  statusEl.textContent = `📁 ${roomId}  |  ${currentUser.displayName || currentUser.email}`;

  const cursorsRef = ref(db, `rooms/${roomId}/cursors`);
  myCursorRef = ref(db, `rooms/${roomId}/cursors/${currentUser.uid}`);
  onDisconnect(myCursorRef).remove();

  unsubscribers.push(onValue(cursorsRef, snap => {
    const data = snap.val() || {};
    canvas.querySelectorAll('.remote-cursor').forEach(el => el.remove());
    renderUsers(data);

    Object.entries(data).forEach(([uid, cur]) => {
      if (uid === currentUser.uid) return;
      const el = document.createElement('div');
      el.className = 'remote-cursor';
      el.style.transform = `translate(${cur.x}px, ${cur.y}px)`;
      el.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 20 20">
          <path d="M2 2 L2 16 L6 12 L9 18 L12 17 L9 11 L15 11 Z"
                fill="${cur.color}" stroke="white" stroke-width="1"/>
        </svg>
        <div class="label" style="background:${cur.color}">${cur.name}</div>
      `;
      canvas.appendChild(el);
    });
  }));

  // 吹き出し
  unsubscribers.push(onValue(ref(db, `rooms/${roomId}/bubbles`), snap => {
    const data = snap.val() || {};
    canvas.querySelectorAll('.cursor-bubble').forEach(el => el.remove());
    Object.entries(data).forEach(([uid, b]) => {
      if (uid === currentUser.uid || !b.text) return;
      const el = document.createElement('div');
      el.className = 'cursor-bubble';
      el.style.transform = `translate(${b.x}px, ${b.y}px)`;
      el.innerHTML = `<div class="bubble" style="background:${b.color};color:white;border-color:${b.color}">
        <div style="font-size:10px;opacity:0.8;margin-bottom:2px;">${escapeHtml(b.name||'')}</div>
        ${escapeHtml(b.text)}
      </div>`;
      canvas.appendChild(el);
    });
  }));

  // 要素
  unsubscribers.push(onValue(ref(db, `rooms/${roomId}/elements`), snap => {
    const data = snap.val() || {};
    Object.keys(elementRefs).forEach(eid => {
      if (!data[eid]) {
        elementRefs[eid].remove();
        delete elementRefs[eid];
        delete elements[eid];
      }
    });
    Object.entries(data).forEach(([eid, el]) => {
      const isEditing = elementRefs[eid] &&
        elementRefs[eid].querySelector('[contenteditable="true"]') === document.activeElement;
      elements[eid] = el;
      if (!elementRefs[eid]) {
        elementRefs[eid] = createElementDOM(eid, el);
        canvas.appendChild(elementRefs[eid]);
      } else if (!isEditing) {
        updateElementDOM(eid, el);
      }
    });
  }));

  if (chatUnsub) chatUnsub();
  chatUnsub = onValue(ref(db, `rooms/${roomId}/chats`), snap => {
    renderChats(snap.val() || {});
  });

  if (isAdmin) {
    if (usersUnsub) usersUnsub();
    usersUnsub = onValue(ref(db, 'users'), snap => {
      allUsers = snap.val() || {};
      if (adminPanel.classList.contains('show')) renderAdminPanel();
    });
  }
}

// ============ 要素DOM ============
function createElementDOM(id, el) {
  const div = document.createElement('div');
  div.className = 'element';
  div.dataset.id = id;
  div.dataset.type = el.type;
  div.style.left = el.x + 'px';
  div.style.top = el.y + 'px';

  const hasCode = el.code && (el.code.html || el.code.css || el.code.js);

  if (hasCode) {
    // iframeレンダリング
    div.classList.add('has-script');
    if (el.width)  div.style.width  = el.width + 'px';
    else div.style.width = '240px';
    if (el.height) div.style.height = el.height + 'px';
    else div.style.height = '160px';

    const wrapper = document.createElement('div');
    wrapper.className = 'script-wrapper';
    wrapper.innerHTML = `<iframe class="script-frame" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>`;
    div.appendChild(wrapper);

    const frame = wrapper.querySelector('iframe');
    frame.srcdoc = buildIframeDoc(el.code, id);
  } else {
    // 通常レンダリング
    switch (el.type) {
      case 'sticky':
        div.classList.add('el-sticky');
        div.style.background = el.color || pickColor(STICKY_COLORS);
        div.textContent = el.content || '';
        applyTextStyle(div, el);
        break;
      case 'text':
        div.classList.add('el-text');
        div.textContent = el.content || 'テキスト';
        applyTextStyle(div, el);
        break;
      case 'rect':
        div.classList.add('el-rect');
        div.style.background = el.color || '#0d99ff';
        if (el.width)  div.style.width  = el.width + 'px';
        if (el.height) div.style.height = el.height + 'px';
        break;
      case 'circle':
        div.classList.add('el-circle');
        div.style.background = el.color || '#0d99ff';
        if (el.width)  div.style.width  = el.width + 'px';
        if (el.height) div.style.height = el.height + 'px';
        break;
      case 'triangle':
        div.classList.add('el-triangle');
        div.style.borderBottomColor = el.color || '#0d99ff';
        break;
      case 'arrow':
        div.classList.add('el-arrow');
        div.style.background = el.color || '#0d99ff';
        div.style.color = el.color || '#0d99ff';
        break;
      case 'comment':
        div.classList.add('el-comment');
        div.textContent = el.content || 'コメント';
        applyTextStyle(div, el);
        break;
      case 'stamp':
        div.classList.add('el-stamp');
        div.textContent = el.content || '⭐';
        if (el.fontSize) div.style.fontSize = el.fontSize + 'px';
        break;
      case 'image':
        div.classList.add('el-image');
        div.innerHTML = `<img src="${el.content}" alt="" draggable="false">`;
        if (el.width) div.style.width = el.width + 'px';
        break;
      default:
        div.textContent = el.content || '';
    }
  }

  // スクリプトバッジ
  if (hasCode) {
    const badge = document.createElement('div');
    badge.className = 'script-badge';
    badge.textContent = '⚡';
    badge.title = 'スクリプト有効';
    div.appendChild(badge);
  }

  // リサイズハンドル
  if (['sticky','text','comment','rect','circle','image'].includes(el.type) || hasCode) {
    ['tl','tr','bl','br'].forEach(pos => {
      const h = document.createElement('div');
      h.className = 'resize-handle ' + pos;
      h.addEventListener('mousedown', (e) => startResize(e, id, pos));
      div.appendChild(h);
    });
  }

  // 削除ボタン
  const del = document.createElement('div');
  del.className = 'delete-btn';
  del.textContent = '×';
  del.addEventListener('click', (e) => {
    e.stopPropagation();
    if (confirm('削除しますか？')) remove(ref(db, `rooms/${roomId}/elements/${id}`));
  });
  div.appendChild(del);

  div.addEventListener('mousedown', onElementMouseDown);
  div.addEventListener('dblclick', onElementDblClick);

  return div;
}

function buildIframeDoc(code, elementId) {
  const bridge = `
    <script>
      (function(){
        const send = (type, msg) => {
          try { parent.postMessage({ __script: true, elementId: '${elementId}', type, msg: String(msg) }, '*'); } catch(e){}
        };
        ['log','warn','error','info'].forEach(k => {
          const orig = console[k];
          console[k] = (...args) => {
            try { orig.apply(console, args); } catch(e){}
            send(k, args.map(a => {
              try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
              catch(e){ return '[object]'; }
            }).join(' '));
          };
        });
        window.addEventListener('error', e => send('error', e.message + ' @line ' + e.lineno));
        window.parent.postMessage({ __script: true, elementId: '${elementId}', type: 'ready', msg: 'loaded' }, '*');
      })();
    <\/script>
  `;

  const wrappedJS = `
    try {
      ${code.js || ''}
    } catch (err) {
      console.error('Script error:', err.message);
    }
  `;

  return `<!DOCTYPE html>
<html><head><meta charset="utf-8">${bridge}
<style>
  html, body { margin:0; padding:0; overflow:hidden; }
  body { font-family: -apple-system, sans-serif; }
  ${code.css || ''}
</style>
</head>
<body>
${code.html || ''}
<script>(function(){ ${wrappedJS} })();<\/script>
</body></html>`;
}

function applyTextStyle(dom, el) {
  if (el.fontSize) dom.style.fontSize = el.fontSize + 'px';
  if (el.color) dom.style.color = el.color;
  if (el.bold) dom.style.fontWeight = 'bold';
  if (el.italic) dom.style.fontStyle = 'italic';
}

function updateElementDOM(id, el) {
  const dom = elementRefs[id];
  if (!dom) return;
  dom.style.left = el.x + 'px';
  dom.style.top = el.y + 'px';
  if (el.width)  dom.style.width  = el.width + 'px';
  if (el.height) dom.style.height = el.height + 'px';

  const hasCode = el.code && (el.code.html || el.code.css || el.code.js);
  const hadCode = dom.classList.contains('has-script');

  // コードの有無が変わったら再生成
  if (hasCode !== hadCode) {
    const newDom = createElementDOM(id, el);
    dom.replaceWith(newDom);
    elementRefs[id] = newDom;
    return;
  }

  if (hasCode) {
    // iframeを更新
    const frame = dom.querySelector('.script-frame');
    if (frame) {
      const newDoc = buildIframeDoc(el.code, id);
      if (frame.srcdoc !== newDoc) frame.srcdoc = newDoc;
    }
    return;
  }

  // 通常要素の更新
  if ((el.type === 'sticky' || el.type === 'text' || el.type === 'comment') &&
      dom.textContent !== el.content && !dom.isContentEditable) {
    dom.textContent = el.content || '';
  }
  if (el.color) {
    if (el.type === 'rect' || el.type === 'circle' || el.type === 'sticky') {
      dom.style.background = el.color;
    } else if (el.type === 'triangle') {
      dom.style.borderBottomColor = el.color;
    } else if (el.type === 'arrow') {
      dom.style.background = el.color;
      dom.style.color = el.color;
    } else if (el.type === 'text' || el.type === 'comment') {
      dom.style.color = el.color;
    }
  }
  if (el.fontSize) dom.style.fontSize = el.fontSize + 'px';
  if (el.bold !== undefined) dom.style.fontWeight = el.bold ? 'bold' : 'normal';
  if (el.italic !== undefined) dom.style.fontStyle = el.italic ? 'italic' : 'normal';
}

// ============ ドラッグ ============
function onElementMouseDown(e) {
  // iframe内クリックは無視（iframeが処理する）
  if (e.target.classList.contains('resize-handle')) return;
  if (e.target.classList.contains('delete-btn')) return;

  const div = e.currentTarget;
  const isScript = div.classList.contains('has-script');
  // スクリプト要素は alt押しながら or 右上×ボタン or リサイズ時のみドラッグ
  if (isScript) {
    // 上部10pxのドラッグハンドル領域のみ
    const rect = div.getBoundingClientRect();
    if (e.clientY - rect.top > 10) {
      // 要素選択だけして、ドラッグしない
      selectedId = div.dataset.id;
      document.querySelectorAll('.element').forEach(d => d.classList.remove('selected'));
      div.classList.add('selected');
      showPropPanel(div.dataset.id);
      return;
    }
  }

  if (div.querySelector('[contenteditable="true"]') === document.activeElement) return;

  e.stopPropagation();

  const id = div.dataset.id;
  const el = elements[id];
  if (!el) return;

  selectedId = id;
  document.querySelectorAll('.element').forEach(d => d.classList.remove('selected'));
  div.classList.add('selected');
  showPropPanel(id);

  isDragging = true;
  currentDragId = id;
  const rect = canvas.getBoundingClientRect();
  dragOffset.x = (e.clientX - rect.left) - el.x;
  dragOffset.y = (e.clientY - rect.top) - el.y;
}

canvas.addEventListener('mousemove', e => {
  if (!currentUser) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (myCursorRef) {
    const now = Date.now();
    if (!window._lastCursorUpdate || now - window._lastCursorUpdate > 50) {
      window._lastCursorUpdate = now;
      const name = currentUser.displayName || currentUser.email.split('@')[0];
      const color = colorForUid(currentUser.uid);
      set(myCursorRef, { x, y, name, color, timestamp: now }).catch(()=>{});
      const bubblesRef = ref(db, `rooms/${roomId}/bubbles/${currentUser.uid}`);
      update(bubblesRef, { x, y, name, color }).catch(()=>{});
      myBubble.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    }
  }

  if (isDragging && currentDragId) {
    const dom = elementRefs[currentDragId];
    if (!dom) return;
    dom.style.left = (x - dragOffset.x) + 'px';
    dom.style.top  = (y - dragOffset.y) + 'px';
  }

  if (resizeState) {
    const { id, pos, startX, startY, origW, origH, origX, origY } = resizeState;
    const dom = elementRefs[id];
    if (!dom) return;
    const dx = x - startX;
    const dy = y - startY;
    let nw = origW, nh = origH, nx = origX, ny = origY;
    if (pos.includes('r')) nw = Math.max(40, origW + dx);
    if (pos.includes('l')) { nw = Math.max(40, origW - dx); nx = origX + dx; }
    if (pos.includes('b')) nh = Math.max(40, origH + dy);
    if (pos.includes('t')) { nh = Math.max(40, origH - dy); ny = origY + dy; }
    dom.style.width = nw + 'px';
    dom.style.height = nh + 'px';
    dom.style.left = nx + 'px';
    dom.style.top = ny + 'px';
    resizeState.newW = nw; resizeState.newH = nh;
    resizeState.newX = nx; resizeState.newY = ny;
  }
});

document.addEventListener('mouseup', () => {
  if (isDragging && currentDragId) {
    const dom = elementRefs[currentDragId];
    if (dom) {
      update(ref(db, `rooms/${roomId}/elements/${currentDragId}`), {
        x: parseInt(dom.style.left),
        y: parseInt(dom.style.top)
      }).catch(()=>{});
    }
  }
  if (resizeState) {
    const { id, newW, newH, newX, newY } = resizeState;
    if (newW && newH) {
      update(ref(db, `rooms/${roomId}/elements/${id}`), {
        width: Math.round(newW),
        height: Math.round(newH),
        x: Math.round(newX),
        y: Math.round(newY)
      }).catch(()=>{});
    }
  }
  isDragging = false;
  currentDragId = null;
  resizeState = null;
});

function startResize(e, id, pos) {
  e.stopPropagation();
  e.preventDefault();
  const dom = elementRefs[id];
  if (!dom) return;
  const rect = canvas.getBoundingClientRect();
  const bcr = dom.getBoundingClientRect();
  resizeState = {
    id, pos,
    startX: e.clientX - rect.left,
    startY: e.clientY - rect.top,
    origW: bcr.width, origH: bcr.height,
    origX: parseInt(dom.style.left),
    origY: parseInt(dom.style.top)
  };
}

// ============ ダブルクリック編集 ============
function onElementDblClick(e) {
  const div = e.currentTarget;
  const id = div.dataset.id;
  const el = elements[id];
  if (!el) return;
  if (div.classList.contains('has-script')) {
    // スクリプト要素はコードエディタを開く
    openCodeEditor(id);
    return;
  }
  if (!['sticky','text','comment'].includes(el.type)) return;
  if (div.contentEditable === 'true') return;

  e.stopPropagation();
  div.contentEditable = 'true';
  div.focus();

  const range = document.createRange();
  range.selectNodeContents(div);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const finish = () => {
    div.contentEditable = 'false';
    div.removeEventListener('blur', finish);
    div.removeEventListener('keydown', onKey);
    update(ref(db, `rooms/${roomId}/elements/${id}`), { content: div.textContent }).catch(()=>{});
  };
  const onKey = (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); div.blur(); }
    if (ev.key === 'Enter' && !ev.shiftKey && el.type !== 'sticky') {
      ev.preventDefault(); div.blur();
    }
  };
  div.addEventListener('blur', finish);
  div.addEventListener('keydown', onKey);
}

// ============ プロパティパネル ============
function showPropPanel(id) {
  const el = elements[id];
  if (!el) { propPanel.classList.remove('show'); return; }
  propPanel.classList.add('show');
  propPanel.innerHTML = '';

  const hasCode = el.code && (el.code.html || el.code.css || el.code.js);
  const isTextType = ['sticky','text','comment'].includes(el.type);
  const isShapeType = ['rect','circle','triangle','arrow'].includes(el.type);
  const isSticky = el.type === 'sticky';
  const isStamp = el.type === 'stamp';

  // --- スクリプトボタン ---
  const gScript = document.createElement('div');
  gScript.className = 'pp-group';
  const codeBtn = document.createElement('button');
  codeBtn.className = 'code-btn' + (hasCode ? ' has-code' : '');
  codeBtn.textContent = hasCode ? '⚡ コード編集' : '⚡ コード追加';
  codeBtn.title = 'スクリプトを埋め込む';
  codeBtn.addEventListener('click', () => openCodeEditor(id));
  gScript.appendChild(codeBtn);
  propPanel.appendChild(gScript);

  // --- 色 ---
  if (!hasCode && (isTextType || isShapeType || isSticky)) {
    const g = document.createElement('div');
    g.className = 'pp-group';
    g.innerHTML = `<label>色</label>`;
    const input = document.createElement('input');
    input.type = 'color';
    input.value = rgbToHex((isSticky || isShapeType) ? (el.color || '#0d99ff') : (el.color || '#222222'));
    input.addEventListener('input', () => {
      update(ref(db, `rooms/${roomId}/elements/${id}`), { color: input.value });
    });
    g.appendChild(input);
    propPanel.appendChild(g);
  }

  // --- サイズ ---
  if (!hasCode && (isTextType || isStamp)) {
    const g = document.createElement('div');
    g.className = 'pp-group';
    g.innerHTML = `<label>サイズ</label>`;
    const input = document.createElement('input');
    input.type = 'number';
    input.min = 8; input.max = 200;
    input.value = el.fontSize || (isStamp ? 60 : 14);
    input.addEventListener('input', () => {
      update(ref(db, `rooms/${roomId}/elements/${id}`), { fontSize: parseInt(input.value) });
    });
    g.appendChild(input);
    propPanel.appendChild(g);
  }

  // --- 太字・斜体 ---
  if (!hasCode && isTextType) {
    const g = document.createElement('div');
    g.className = 'pp-group';
    const boldBtn = document.createElement('button');
    boldBtn.textContent = 'B';
    boldBtn.style.fontWeight = 'bold';
    if (el.bold) boldBtn.classList.add('active');
    boldBtn.addEventListener('click', () => {
      update(ref(db, `rooms/${roomId}/elements/${id}`), { bold: !el.bold });
    });
    const italicBtn = document.createElement('button');
    italicBtn.textContent = 'I';
    italicBtn.style.fontStyle = 'italic';
    if (el.italic) italicBtn.classList.add('active');
    italicBtn.addEventListener('click', () => {
      update(ref(db, `rooms/${roomId}/elements/${id}`), { italic: !el.italic });
    });
    g.appendChild(boldBtn);
    g.appendChild(italicBtn);
    propPanel.appendChild(g);
  }

  // --- スタンプ ---
  if (!hasCode && isStamp) {
    const g = document.createElement('div');
    g.className = 'pp-group';
    g.innerHTML = `<label>絵文字</label>`;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = el.content || '⭐';
    input.maxLength = 4;
    input.style.cssText = 'width:50px;text-align:center;font-size:16px;';
    input.addEventListener('change', () => {
      update(ref(db, `rooms/${roomId}/elements/${id}`), { content: input.value || '⭐' });
    });
    g.appendChild(input);
    propPanel.appendChild(g);
  }

  // --- レイヤー ---
  const gLayer = document.createElement('div');
  gLayer.className = 'pp-group';
  const upBtn = document.createElement('button');
  upBtn.textContent = '⬆';
  upBtn.title = '前面へ';
  upBtn.addEventListener('click', () => {
    update(ref(db, `rooms/${roomId}/elements/${id}`), { z: Date.now() });
  });
  const downBtn = document.createElement('button');
  downBtn.textContent = '⬇';
  downBtn.title = '背面へ';
  downBtn.addEventListener('click', () => {
    update(ref(db, `rooms/${roomId}/elements/${id}`), { z: 1 });
  });
  gLayer.appendChild(upBtn);
  gLayer.appendChild(downBtn);
  propPanel.appendChild(gLayer);

  // --- 複製 ---
  const gDup = document.createElement('div');
  gDup.className = 'pp-group';
  const dupBtn = document.createElement('button');
  dupBtn.textContent = '⧉';
  dupBtn.title = '複製';
  dupBtn.addEventListener('click', async () => {
    const newId = newElemId();
    const copy = JSON.parse(JSON.stringify(el));
    copy.x = (el.x || 0) + 20;
    copy.y = (el.y || 0) + 20;
    await set(ref(db, `rooms/${roomId}/elements/${newId}`), copy);
  });
  gDup.appendChild(dupBtn);
  propPanel.appendChild(gDup);
}

function rgbToHex(color) {
  if (!color) return '#000000';
  if (color.startsWith('#')) return color.slice(0, 7);
  return color;
}

// 選択解除
canvas.addEventListener('click', (e) => {
  if (e.target === canvas) {
    document.querySelectorAll('.element').forEach(d => d.classList.remove('selected'));
    selectedId = null;
    propPanel.classList.remove('show');
    hideSlashMenu();
  }
});

// ============ コードエディタ ============
function openCodeEditor(id) {
  editingCodeId = id;
  const el = elements[id];
  if (!el) return;
  editingCodeData = {
    html: (el.code && el.code.html) || '',
    css:  (el.code && el.code.css)  || '',
    js:   (el.code && el.code.js)   || ''
  };

  // タブ初期化
  currentCodeTab = 'html';
  document.querySelectorAll('.code-head .tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === 'html');
  });
  codeTextarea.value = editingCodeData.html;

  codeModal.classList.add('show');
  codeTextarea.focus();
}

document.querySelectorAll('.code-head .tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    // 現在のタブを保存
    editingCodeData[currentCodeTab] = codeTextarea.value;
    currentCodeTab = btn.dataset.tab;
    document.querySelectorAll('.code-head .tabs button').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
    codeTextarea.value = editingCodeData[currentCodeTab] || '';
  });
});

codeTextarea.addEventListener('input', () => {
  editingCodeData[currentCodeTab] = codeTextarea.value;
});

document.getElementById('codeClose').addEventListener('click', () => closeCodeEditor());
document.getElementById('codeCancel').addEventListener('click', () => closeCodeEditor());

document.getElementById('codeSave').addEventListener('click', async () => {
  if (!editingCodeId || !roomId) return;
  editingCodeData[currentCodeTab] = codeTextarea.value;
  await update(ref(db, `rooms/${roomId}/elements/${editingCodeId}`), {
    code: editingCodeData,
    // デフォルトサイズを確保
    width: elements[editingCodeId].width || 240,
    height: elements[editingCodeId].height || 160
  });
  closeCodeEditor();
  showHint('⚡ スクリプトを保存しました');
});

document.getElementById('codeRemove').addEventListener('click', async () => {
  if (!editingCodeId || !roomId) return;
  if (!confirm('スクリプトを削除しますか？')) return;
  await remove(ref(db, `rooms/${roomId}/elements/${editingCodeId}/code`));
  closeCodeEditor();
  showHint('スクリプトを削除');
});

function closeCodeEditor() {
  codeModal.classList.remove('show');
  editingCodeId = null;
  codeTextarea.value = '';
}

// テンプレート
document.querySelectorAll('.code-foot .examples button').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.ex;
    const tpl = CODE_TEMPLATES[key];
    if (!tpl) return;
    editingCodeData = JSON.parse(JSON.stringify(tpl));
    currentCodeTab = 'html';
    document.querySelectorAll('.code-head .tabs button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === 'html');
    });
    codeTextarea.value = editingCodeData.html;
  });
});

// ============ 要素追加 ============
async function addElement(type, opts = {}) {
  if (!roomId) return;
  const cx = canvas.clientWidth / 2 - 80 + (Math.random() - 0.5) * 200;
  const cy = canvas.clientHeight / 2 - 80 + (Math.random() - 0.5) * 200;
  const x = opts.x ?? cx;
  const y = opts.y ?? cy;

  const base = {
    type, x: Math.round(x), y: Math.round(y),
    author: currentUser.displayName || currentUser.email
  };

  let payload;
  switch (type) {
    case 'sticky':
      payload = { ...base, color: pickColor(STICKY_COLORS), content: '', fontSize: 14 };
      break;
    case 'text':
      payload = { ...base, color: '#222222', content: 'テキスト', fontSize: 18 };
      break;
    case 'rect':
      payload = { ...base, color: pickColor(SHAPE_COLORS), width: 160, height: 100 };
      break;
    case 'circle':
      payload = { ...base, color: pickColor(SHAPE_COLORS), width: 120, height: 120 };
      break;
    case 'triangle':
      payload = { ...base, color: pickColor(SHAPE_COLORS) };
      break;
    case 'arrow':
      payload = { ...base, color: '#0d99ff' };
      break;
    case 'comment':
      payload = { ...base, content: 'コメント', fontSize: 13 };
      break;
    case 'stamp': {
      const stamp = prompt('絵文字を入力 (例: ⭐):', pickColor(STAMPS));
      if (!stamp) return;
      payload = { ...base, content: stamp, fontSize: 60 };
      break;
    }
    case 'image': {
      const url = prompt('画像URLを入力:');
      if (!url) return;
      payload = { ...base, content: url };
      break;
    }
    case 'button': {
      payload = {
        ...base,
        type: 'rect',
        color: '#0d99ff',
        width: 240,
        height: 160,
        code: JSON.parse(JSON.stringify(CODE_TEMPLATES.button))
      };
      break;
    }
    default:
      return;
  }

  const newRef = push(ref(db, `rooms/${roomId}/elements`));
  await set(newRef, payload);
  if (type === 'button') showHint('🔘 ボタン追加。ダブルクリックでコード編集');
}

// ============ スラッシュメニュー ============
let slashActiveIndex = 0;
let slashFiltered = COMMANDS.slice();

function showSlashMenu(x, y) {
  slashActiveIndex = 0;
  slashFiltered = COMMANDS.slice();
  renderSlashMenu();
  slashMenu.style.left = Math.min(x, window.innerWidth - 300) + 'px';
  slashMenu.style.top  = Math.min(y, window.innerHeight - 420) + 'px';
  slashMenu.classList.add('show');
}

function hideSlashMenu() { slashMenu.classList.remove('show'); }

function renderSlashMenu() {
  if (slashFiltered.length === 0) {
    slashMenu.innerHTML = '<div style="padding:16px;color:#999;font-size:13px;">該当なし</div>';
    return;
  }
  if (slashActiveIndex >= slashFiltered.length) slashActiveIndex = 0;

  slashMenu.innerHTML = slashFiltered.map((c, i) => `
    <div class="slash-item ${i === slashActiveIndex ? 'active' : ''}" data-index="${i}">
      <div class="slash-icon">${c.icon}</div>
      <div class="slash-info">
        <div class="si-name">${c.name}</div>
        <div class="si-desc">${c.desc}</div>
      </div>
      <div class="si-cmd">${c.cmd}</div>
    </div>
  `).join('');

  slashMenu.querySelectorAll('.slash-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.index);
      executeCommand(slashFiltered[idx].id);
    });
    item.addEventListener('mouseenter', () => {
      slashActiveIndex = parseInt(item.dataset.index);
      slashMenu.querySelectorAll('.slash-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
    });
  });
}

async function executeCommand(id) {
  hideSlashMenu();
  switch (id) {
    case 'sticky':   await addElement('sticky'); showHint('📝 付箋追加'); break;
    case 'text':     await addElement('text');   showHint('🅰 ダブルクリックで編集'); break;
    case 'rect':     await addElement('rect'); break;
    case 'circle':   await addElement('circle'); break;
    case 'triangle': await addElement('triangle'); break;
    case 'arrow':    await addElement('arrow'); break;
    case 'comment':  await addElement('comment'); showHint('💬 ダブルクリックで編集'); break;
    case 'stamp':    await addElement('stamp'); break;
    case 'image':    await addElement('image'); break;
    case 'button':   await addElement('button'); break;
    case 'chat':     toggleChat(true); break;
    case 'clear':
      if (confirm('全要素を削除しますか？')) remove(ref(db, `rooms/${roomId}/elements`));
      break;
  }
}

function showHint(msg) {
  hintEl.textContent = msg;
  hintEl.classList.add('show');
  clearTimeout(window._hintTimer);
  window._hintTimer = setTimeout(() => hintEl.classList.remove('show'), 2000);
}
function showPasteHint(msg) {
  pasteHint.textContent = msg;
  pasteHint.classList.add('show');
  clearTimeout(window._pasteHintTimer);
  window._pasteHintTimer = setTimeout(() => pasteHint.classList.remove('show'), 1500);
}

// ============ スクリプトからのメッセージ受信 ============
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;

  if (d.__script) {
    // スクリプトログ
    if (d.type === 'ready') return;
    addLog(d.type, d.msg);
  } else if (d.type === 'notify') {
    // スクリプトからの通知
    showHint('⚡ ' + d.text);
  }
});

function addLog(type, msg) {
  scriptLogLines.push({ type, msg, time: Date.now() });
  if (scriptLogLines.length > 100) scriptLogLines.shift();
  renderLogs();
  scriptLog.classList.add('show');
  clearTimeout(window._logHideTimer);
  window._logHideTimer = setTimeout(() => {
    if (!scriptLog.matches(':hover')) scriptLog.classList.remove('show');
  }, 5000);
}

function renderLogs() {
  logBody.innerHTML = scriptLogLines.map(l => `
    <div class="log-line ${l.type}">[${l.type}] ${escapeHtml(l.msg)}</div>
  `).join('');
  logBody.scrollTop = logBody.scrollHeight;
}

document.getElementById('logClear').addEventListener('click', () => {
  scriptLogLines = [];
  renderLogs();
  scriptLog.classList.remove('show');
});

document.getElementById('logBtn').addEventListener('click', () => {
  scriptLog.classList.toggle('show');
});

// ============ キーボード ============
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inEditable = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

  // コードモーダルが開いているとき
  if (codeModal.classList.contains('show')) {
    if (e.key === 'Escape') { e.preventDefault(); closeCodeEditor(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('codeSave').click();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      document.getElementById('codeSave').click();
      return;
    }
    return;
  }

  if (slashMenu.classList.contains('show')) {
    if (e.key === 'Escape') { e.preventDefault(); hideSlashMenu(); return; }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      slashActiveIndex = (slashActiveIndex + 1) % slashFiltered.length;
      renderSlashMenu();
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      slashActiveIndex = (slashActiveIndex - 1 + slashFiltered.length) % slashFiltered.length;
      renderSlashMenu();
      return;
    }
    if (e.key === 'Enter' && !inEditable) {
      e.preventDefault();
      executeCommand(slashFiltered[slashActiveIndex].id);
      return;
    }
  }

  if (inEditable) return;

  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
    e.preventDefault();
    remove(ref(db, `rooms/${roomId}/elements/${selectedId}`));
    selectedId = null;
    propPanel.classList.remove('show');
    return;
  }

  if (e.key === 'c' || e.key === 'C') {
    e.preventDefault();
    toggleChat();
  }

  if (e.key === ' ' && !e.repeat && !myBubble.classList.contains('show')) {
    e.preventDefault();
    openMyBubble();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.target.isContentEditable &&
      e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' &&
      !codeModal.classList.contains('show')) {
    e.preventDefault();
    showSlashMenu(window.innerWidth / 2 - 140, window.innerHeight / 2 - 150);
  }
});

// ============ 吹き出し ============
function openMyBubble() {
  const x = window._lastMouseX || window.innerWidth / 2;
  const y = window._lastMouseY || window.innerHeight / 2;
  myBubble.style.transform = `translate(${x}px, ${y}px)`;
  myBubble.classList.add('show');
  setTimeout(() => myBubbleInput.focus(), 50);

  const bubblesRef = ref(db, `rooms/${roomId}/bubbles/${currentUser.uid}`);
  set(bubblesRef, {
    x: x - canvas.getBoundingClientRect().left,
    y: y - canvas.getBoundingClientRect().top,
    name: currentUser.displayName || currentUser.email.split('@')[0],
    color: colorForUid(currentUser.uid),
    text: '',
    timestamp: Date.now()
  }).catch(()=>{});
  onDisconnect(bubblesRef).remove();
}

function sendBubble() {
  const text = myBubbleInput.value.trim();
  if (!text) { closeBubble(); return; }
  const bubblesRef = ref(db, `rooms/${roomId}/bubbles/${currentUser.uid}`);
  update(bubblesRef, { text, timestamp: Date.now() }).catch(()=>{});

  const msgRef = push(ref(db, `rooms/${roomId}/chats`));
  set(msgRef, {
    text,
    author: currentUser.displayName || currentUser.email.split('@')[0],
    email: currentUser.email,
    photo: currentUser.photoURL || '',
    timestamp: Date.now()
  }).catch(()=>{});

  setTimeout(() => {
    update(bubblesRef, { text: '' }).catch(()=>{});
  }, 5000);

  myBubbleInput.value = '';
  closeBubble();
}

function closeBubble() {
  myBubble.classList.remove('show');
  const bubblesRef = ref(db, `rooms/${roomId}/bubbles/${currentUser.uid}`);
  remove(bubblesRef).catch(()=>{});
  myBubbleInput.value = '';
}

myBubbleInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendBubble(); }
  if (e.key === 'Escape') { e.preventDefault(); closeBubble(); }
});
document.getElementById('myBubbleSend').addEventListener('click', sendBubble);
document.getElementById('myBubbleClose').addEventListener('click', closeBubble);

document.addEventListener('mousemove', (e) => {
  window._lastMouseX = e.clientX;
  window._lastMouseY = e.clientY;
});

// ============ 画像ペースト ============
document.addEventListener('paste', async (e) => {
  if (!roomId || !currentUser) return;
  if (codeModal.classList.contains('show')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

  const items = e.clipboardData?.items || [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (!file) continue;
      try {
        const dataUrl = await fileToDataURL(file);
        if (dataUrl.length > 900000) {
          const resized = await resizeImage(dataUrl, 1200, 0.85);
          await pasteImage(resized);
        } else {
          await pasteImage(dataUrl);
        }
        showPasteHint('📋 画像を貼り付けました');
      } catch (err) {
        showPasteHint('❌ 画像の貼り付けに失敗');
      }
      return;
    }
  }
});

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function resizeImage(dataUrl, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(1, maxWidth / img.width);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function pasteImage(dataUrl) {
  const cx = canvas.clientWidth / 2 - 150 + (Math.random() - 0.5) * 200;
  const cy = canvas.clientHeight / 2 - 150 + (Math.random() - 0.5) * 200;
  const newId = newElemId();
  await set(ref(db, `rooms/${roomId}/elements/${newId}`), {
    type: 'image',
    x: Math.round(cx),
    y: Math.round(cy),
    content: dataUrl,
    author: currentUser.displayName || currentUser.email
  });
}

// ============ ユーザー ============
function renderUsers(cursorsData) {
  usersEl.innerHTML = '';
  Object.entries(cursorsData).forEach(([uid, cur]) => {
    const info = allUsers[uid] || {};
    const dot = document.createElement('div');
    dot.className = 'user-dot';
    if (uid === currentUser.uid) dot.classList.add('me');
    if (isAdminEmail(info.email) || isAdminUid(uid)) dot.classList.add('admin');

    if (info.photo) {
      dot.innerHTML = `<img src="${info.photo}" alt="">`;
    } else {
      dot.style.background = cur.color || colorForUid(uid);
      dot.textContent = (cur.name || '?').slice(-2);
    }
    dot.title = `${cur.name || uid}${(isAdminEmail(info.email) || isAdminUid(uid)) ? ' 👑' : ''}`;
    usersEl.appendChild(dot);
  });
}

// ============ チャット ============
function toggleChat(force) {
  if (force === true) chatPanel.classList.add('show');
  else if (force === false) chatPanel.classList.remove('show');
  else chatPanel.classList.toggle('show');
  if (chatPanel.classList.contains('show')) {
    setTimeout(() => chatInput.focus(), 50);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
}

document.getElementById('chatBtn').addEventListener('click', () => toggleChat());
document.getElementById('chatClose').addEventListener('click', () => toggleChat(false));
document.getElementById('chatSend').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
});

async function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !roomId) return;
  chatInput.value = '';
  const msgRef = push(ref(db, `rooms/${roomId}/chats`));
  await set(msgRef, {
    text,
    author: currentUser.displayName || currentUser.email.split('@')[0],
    email: currentUser.email,
    photo: currentUser.photoURL || '',
    timestamp: Date.now()
  });
}

function renderChats(data) {
  const msgs = Object.entries(data)
    .map(([id, m]) => ({ id, ...m }))
    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
  chatMessages.innerHTML = '';
  msgs.forEach(m => {
    const div = document.createElement('div');
    const mine = m.email === currentUser.email;
    div.className = 'chat-msg' + (mine ? ' mine' : '');
    const time = new Date(m.timestamp || 0).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `
      <div class="cm-author">${escapeHtml(m.author || '')}</div>
      <div class="cm-text">${escapeHtml(m.text || '')}</div>
      <div class="cm-time">${time}</div>
    `;
    chatMessages.appendChild(div);
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

document.getElementById('slashBtn').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  showSlashMenu(rect.left, rect.bottom + 6);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!roomId) return;
  if (!confirm('全要素を削除しますか？')) return;
  remove(ref(db, `rooms/${roomId}/elements`));
});

document.getElementById('joinBtn').addEventListener('click', () => {
  const id = document.getElementById('roomInput').value.trim() || 'default';
  joinRoom(id);
});

adminBtn.addEventListener('click', () => {
  adminPanel.classList.toggle('show');
  if (adminPanel.classList.contains('show')) {
    get(ref(db, 'users')).then(snap => {
      allUsers = snap.val() || {};
      renderAdminPanel();
    });
  }
});

document.getElementById('apClose').addEventListener('click', () => {
  adminPanel.classList.remove('show');
});

function renderAdminPanel() {
  if (!isAdmin) {
    apBody.innerHTML = '<div style="color:#e74c3c;font-size:13px;">管理者権限がありません</div>';
    return;
  }
  const users = Object.entries(allUsers);
  if (users.length === 0) {
    apBody.innerHTML = '<div style="color:#999;font-size:13px;">ユーザーがいません</div>';
    return;
  }
  users.sort((a, b) => (b[1].lastSeen || 0) - (a[1].lastSeen || 0));
  apBody.innerHTML = '';

  users.forEach(([uid, u]) => {
    const isBanned = !!bannedUsers[uid];
    const isSelf = uid === currentUser.uid;
    const isAdminUser = isAdminEmail(u.email) || isAdminUid(uid);

    const row = document.createElement('div');
    row.className = 'user-row' + (isBanned ? ' banned' : '');

    const avatar = u.photo
      ? `<img src="${u.photo}" alt="">`
      : `<div class="ph">${(u.name || '?').slice(0, 1).toUpperCase()}</div>`;

    const badges = [];
    if (isAdminUser) badges.push('<span class="badge-admin">👑 管理者</span>');
    if (isBanned) badges.push('<span class="badge-ban">BAN</span>');

    row.innerHTML = `
      ${avatar}
      <div class="uinfo">
        <div class="uname">${escapeHtml(u.name || '(no name)')} ${badges.join(' ')}</div>
        <div class="uemail">${escapeHtml(u.email || '')}</div>
      </div>
    `;

    if (!isAdminUser && !isSelf) {
      const btn = document.createElement('button');
      btn.className = 'ubtn' + (isBanned ? ' unban' : '');
      btn.textContent = isBanned ? '解除' : 'BAN';
      btn.addEventListener('click', async () => {
        if (isBanned) {
          if (!confirm(`${u.email} のBANを解除しますか？`)) return;
          await remove(ref(db, `banned/${uid}`));
        } else {
          if (!confirm(`${u.email} をBANしますか？`)) return;
          await set(ref(db, `banned/${uid}`), {
            email: u.email || '',
            bannedAt: Date.now(),
            bannedBy: currentUser.email
          });
        }
      });
      row.appendChild(btn);
    }
    apBody.appendChild(row);
  });
}
