<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>動画ダウンロード</title>
<style>
  .download-btn {
    display: inline-block;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .download-btn:hover { background: #1d4ed8; }
  .download-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  #status {
    margin-top: 12px;
    font-size: 14px;
    color: #374151;
    min-height: 20px;
  }
</style>
</head>
<body>

<button id="downloadBtn" class="download-btn">動画を3つダウンロード</button>
<div id="status"></div>

<script>
  // ===== 設定エリア：ここを書き換える =====
  const VIDEOS = [
    { url: 'https://example.com/video1.mp4', filename: '動画1_高画質.mp4' },
    { url: 'https://example.com/video2.mp4', filename: '動画2_高画質.mp4' },
    { url: 'https://example.com/video3.mp4', filename: '動画3_高画質.mp4' }
  ];
  const INTERVAL_MS = 2000; // ダウンロード間隔（2秒）
  // ========================================

  const btn = document.getElementById('downloadBtn');
  const statusEl = document.getElementById('status');

  function triggerDownload(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;

    for (let i = 0; i < VIDEOS.length; i++) {
      const video = VIDEOS[i];

      // ダウンロード開始
      triggerDownload(video.url, video.filename);
      statusEl.textContent = `${i + 1} / ${VIDEOS.length} 個目をダウンロード開始…`;

      // 最後の1個以外は2秒待機
      if (i < VIDEOS.length - 1) {
        await new Promise(resolve => setTimeout(resolve, INTERVAL_MS));
      }
    }

    statusEl.textContent = 'すべてのダウンロードを開始しました ✅';
    btn.disabled = false;
  });
</script>

</body>
</html>
