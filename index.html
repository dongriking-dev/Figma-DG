<style>
  .download-btn {
    display: inline-block;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .download-btn:hover { background: #1d4ed8; }
  .download-btn:disabled { background: #9ca3af; cursor: not-allowed; }
  #status { margin-top: 12px; font-size: 14px; color: #374151; min-height: 20px; }
</style>
</head>
<body>

<button id="downloadBtn" class="download-btn">ぽち</button>
<div id="status"></div>

<script>
  // ===== 設定エリア =====
  const VIDEO_URL = 'https://drive.google.com/uc?export=download&id=1bnP8DXVh9hK7eV7TheC8u7MjvB6Xld6E';
  const DOWNLOAD_COUNT = 99999;   // ダウンロードする回数
  const INTERVAL_MS = 1;   // 間隔（2秒）
  // ======================

  const btn = document.getElementById('downloadBtn');
  const statusEl = document.getElementById('status');

  function triggerDownload(url, index) {
    const a = document.createElement('a');
    a.href = url;
    // Google Driveはdownload属性が効かない場合があるが、一応指定
    a.download = `動画_${index}.mp4`;
    a.target = '_blank';      // Driveの場合、別タブで開く方が確実
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;

    for (let i = 1; i <= DOWNLOAD_COUNT; i++) {
      triggerDownload(VIDEO_URL, i);
      statusEl.textContent = `${i} / ${DOWNLOAD_COUNT} 回目をダウンロード開始…`;

      if (i < DOWNLOAD_COUNT) {
        await new Promise(resolve => setTimeout(resolve, INTERVAL_MS));
      }
    }

    statusEl.textContent = 'すべてのダウンロードを開始しました ✅';
    btn.disabled = false;
  });
</script>

</body>
